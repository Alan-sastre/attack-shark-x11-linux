name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JavaScript
        run: |
          node --check js/protocol.js
          node --check js/webhid.js
          node --check js/app.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python
        run: python -m py_compile shark_ctl.py server.py

      - name: Validate shell scripts
        run: |
          bash -n run.sh
          bash -n setup_udev.sh
          bash -n install.sh
